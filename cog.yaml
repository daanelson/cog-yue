build:
  gpu: true
  cuda: "12.4"
  python_version: "3.12"
  python_packages:
    - torch==2.5.1
    - omegaconf
    - torchaudio
    - einops
    - numpy
    - transformers
    - sentencepiece
    - tqdm
    - tensorboard
    - descript-audiotools>=0.7.2
    - descript-audio-codec==1.0.0
    - scipy
    - accelerate>=0.26.0
    - huggingface_hub
  run:
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/latest/download/pget_$(uname -s)_$(uname -m)" && chmod +x /usr/local/bin/pget
    - pip install vllm
predict: "vllm_predict.py:Predictor"
